<form onsubmit="handleLogin(event)">
            <div class="email-group">
                <input type="email" class="form-control" id="loginEmail" placeholder="Электронная почта" required value="mama@family.ru">
            </div>
            <div class="password-group">
                <input type="password" class="form-control" id="loginPassword" placeholder="Пароль" required value="12345">
                <span class="eye-toggle" id="eyeToggle" onclick="togglePassword()">👁</span>
            </div>
            <div class="error-message" id="errorMessage">Введите корректные данные</div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Войти</button>
        </form>

        <div class="link-text">Нет аккаунта? <a onclick="goToRegister()">Зарегистрироваться</a></div>
        <div class="hint-text">💡  Демо-пароль для всех: <strong>12345</strong></div>
    </div>

    <script>
        function selectAccount(element) {
            document.querySelectorAll('.account-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('loginEmail').value = element.getAttribute('data-email');
            document.getElementById('loginPassword').focus();
        }

        function togglePassword() {
            let p = document.getElementById('loginPassword');
            let e = document.getElementById('eyeToggle');
            if (p.type === 'password') { p.type = 'text'; e.textContent = '🙈 '; }
            else { p.type = 'password'; e.textContent = '👁'; }
        }

        function handleLogin(event) {
            event.preventDefault();
            let email = document.getElementById('loginEmail').value.trim();
            let password = document.getElementById('loginPassword').value.trim();

            let emailPattern = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i;
            if (!emailPattern.test(email)) { showError("Введите корректный email"); return; }

            // Ищем зарегистрированных пользователей в sessionStorage
            let registeredUsers = JSON.parse(sessionStorage.getItem('registeredUsers')) || [];
            let foundUser = registeredUsers.find(u => u.email === email);

            if (foundUser) {
                if (foundUser.password !== password) { showError("Неверный пароль"); return; }
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('userEmail', email);
                sessionStorage.setItem('userName', foundUser.name);
                sessionStorage.setItem('userRole', foundUser.role);

                if (foundUser.role === 'parent') {
                    window.location.href = 'parent.html';
                } else {
                    alert('Вы вошли как ребенок. Страница для ребенка пока в разработке.');
                }
                return;
            }

            // Демо-аккаунты
            if (password !== '12345') { showError("Неверный пароль. Подсказка: 12345"); return; }

            let userName = "Пользователь";
            let userRole = "parent";
            if (email === 'mama@family.ru') { userName = "Мама"; userRole = "parent"; }
            else if (email === 'papa@family.ru') { userName = "Папа"; userRole = "parent"; }
            else if (email === 'son@family.ru') { userName = "Сын"; userRole = "child"; }
            else if (email === 'daughter@family.ru') { userName = "Дочь"; userRole = "child"; }
            else { userName = email.split('@')[0]; userRole = "parent"; }

            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('userEmail', email);
            sessionStorage.setItem('userName', userName);
            sessionStorage.setItem('userRole', userRole);

            if (userRole === 'parent') {
                window.location.href = 'parent.html';
            } else {
                alert('Вы вошли как ребенок. Страница для ребенка пока в разработке.');
            }
}

        function goToRegister() { window.location.href = 'register.html'; }

        function showError(message) {
            let el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
