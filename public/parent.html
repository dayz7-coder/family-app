<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Кабинет</title>
  <style>
    body { font-family: sans-serif; background: #f4f6fb; padding: 2rem; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; }
    .user { padding: 10px; border-bottom: 1px solid #eee; }
    .btn { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; float: right; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Семья</h2>
    <div id="users-list">Загрузка...</div>
  </div>

  <script>
    const API_KEY = 'family_secret_2024';

    async function loadUsers() {
      const list = document.getElementById('users-list');
      try {
        const res = await fetch('/api/users', {
          headers: { 'x-api-key': API_KEY }
        });
        
        if (!res.ok) throw new Error('Ошибка загрузки');
        const users = await res.json();

        if (users.length === 0) {
          list.innerHTML = '<p>Нет пользователей</p>';
        } else {
          list.innerHTML = users.map(u => `
            <div class="user">
              <strong>${u.full_name}</strong> (${u.role})
            </div>
          `).join('');
        }
      } catch (e) {
        list.innerHTML = `<p style="color:red">${e.message}</p>`;
      }
    }

    // Загружаем при открытии
    loadUsers();
  </script>
</body>
</html>
