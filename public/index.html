<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Семья — Родители и Дети</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>👨‍👩‍👧‍👦 Семья</h1>
    <p>Управление родителями и детьми</p>
  </header>

  <main>
    <!-- Форма добавления -->
    <section class="card">
      <h2>➕ Добавить пользователя</h2>
      <form id="user-form">
        <input type="text"   id="fullName" placeholder="Имя и фамилия" required>
        <input type="email"  id="email"    placeholder="Email" required>
        <input type="password" id="password" placeholder="Пароль" required>
        <select id="role">
          <option value="PARENT">👨 Родитель</option>
          <option value="CHILD">🧒 Ребёнок</option>
        </select>
        <input type="date" id="birthDate" placeholder="Дата рождения (для ребёнка)">
        <button type="submit">Добавить</button>
      </form>
      <div id="form-msg"></div>
    </section>

    <!-- Список пользователей -->
    <section class="card">
      <h2>👥 Все пользователи</h2>
      <div class="tabs">
        <button class="tab active" data-role="">Все</button>
        <button class="tab" data-role="PARENT">👨 Родители</button>
        <button class="tab" data-role="CHILD">🧒 Дети</button>
      </div>
      <div id="users-list">Загрузка...</div>
    </section>

    <!-- Связи -->
    <section class="card">
      <h2>🔗 Привязать ребёнка к родителю</h2>
      <form id="link-form">
        <select id="parentSelect" required>
          <option value="">Выберите родителя</option>
        </select>
        <select id="childSelect" required>
          <option value="">Выберите ребёнка</option>
        </select>
        <button type="submit">Привязать</button>
      </form>
      <div id="link-msg"></div>
    </section>

    <!-- Дерево семьи -->
    <section class="card">
      <h2>🌳 Дерево семьи</h2>
      <div id="tree">Загрузка...</div>
    </section>
  </main>

  <footer>
    <p>Сервер: <code id="api-status">проверка...</code></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
