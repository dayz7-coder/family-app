<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Семейное расписание</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0d6efd, #0a58ca); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .register-card { background: white; padding: 35px 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 480px; }
        .register-card h2 { text-align: center; color: #0d6efd; font-weight: 700; margin-bottom: 5px; }
        .register-card p.subtitle { text-align: center; color: #6c757d; margin-bottom: 25px; font-size: 0.95rem; }
        .role-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .role-btn { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .role-btn:hover { border-color: #0d6efd; background: #e7f1ff; }
        .role-btn.active { border-color: #0d6efd; background: #e7f1ff; box-shadow: 0 4px 10px rgba(13,110,253,0.2); }
        .role-btn .avatar { font-size: 2rem; display: block; margin-bottom: 8px; }
        .role-btn .role-name { font-weight: 600; color: #495057; font-size: 1rem; }
        .role-btn .role-desc { font-size: 0.75rem; color: #6c757d; margin-top: 4px; }
        .register-card .form-control, .register-card .form-select { padding: 12px 15px; border-radius: 10px; border: 1px solid #ced4da; font-size: 1rem; margin-bottom: 15px; }
        .register-card .form-control:focus, .register-card .form-select:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.25); }
        .register-card .form-label { font-size: 0.85rem; color: #495057; font-weight: 500; margin-bottom: 5px; }
        .register-card .btn-primary { padding: 12px; border-radius: 10px; font-weight: 600; font-size: 1rem; background: #0d6efd; border: none; }
        .register-card .btn-primary:hover { background: #0a58ca; }
        .link-text { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #6c757d; }
        .link-text a { color: #0d6efd; text-decoration: none; font-weight: 500; cursor: pointer; }
        .link-text a:hover { text-decoration: underline; }
        .error-message { color: #dc3545; font-size: 0.9rem; text-align: center; margin-top: 10px; display: none; }
        .password-group { position: relative; margin-bottom: 15px; }
        .password-group .form-control { padding-right: 45px; margin-bottom: 0; }
        .eye-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.2rem; color: #6c757d; user-select: none; }
        .eye-toggle:hover { color: #0d6efd; }
        #childExtraFields { display: none; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2>📝  Регистрация</h2>
        <p class="subtitle">Создайте аккаунт в семейном расписании</p>

        <div class="role-selector">
            <div class="role-btn active" id="roleParent" onclick="selectRole('parent')">
                <span class="avatar">👨‍👩‍👧 </span>
                <span class="role-name">Родитель</span>
                <div class="role-desc">Управляю расписанием</div>
            </div>
            <div class="role-btn" id="roleChild" onclick="selectRole('child')">
                <span class="avatar">🧒 </span>
                <span class="role-name">Ребенок</span>
                <div class="role-desc">Смотрю свое расписание</div>
            </div>
        </div>

        <form onsubmit="handleRegister(event)">
            <div>
                <label class="form-label">Имя</label>
                <input type="text" class="form-control" id=
22:55
"regName" placeholder="Ваше имя" required>
            </div>
            <div>
                <label class="form-label">Город</label>
                <select class="form-select" id="regCity" required onchange="updateSchools()">
                    <option value="" disabled selected>Выберите город</option>
                    <option value="Москва">Москва</option>
                    <option value="Санкт-Петербург">Санкт-Петербург</option>
                    <option value="Новосибирск">Новосибирск</option>
                    <option value="Екатеринбург">Екатеринбург</option>
                    <option value="Казань">Казань</option>
                    <option value="Нижний Новгород">Нижний Новгород</option>
                    <option value="Челябинск">Челябинск</option>
                    <option value="Самара">Самара</option>
                    <option value="Омск">Омск</option>
                    <option value="Ростов-на-Дону">Ростов-на-Дону</option>
                    <option value="Сургут">Сургут</option>
                </select>
            </div>
            <div>
                <label class="form-label">Школа</label>
                <select class="form-select" id="regSchool" required disabled>
                    <option value="" disabled selected>Сначала выберите город</option>
                </select>
            </div>
            <div>
                <label class="form-label">Электронная почта</label>
                <input type="email" class="form-control" id="regEmail" placeholder="example@mail.ru" required>
            </div>
            <div>
                <label class="form-label">Пароль</label>
                <div class="password-group">
                    <input type="password" class="form-control" id="regPassword" placeholder="Минимум 5 символов" required minlength="5">
                    <span class="eye-toggle" id="eyeToggle" onclick="togglePassword()">👁</span>
                </div>
            </div>
            <div id="childExtraFields">
                <label class="form-label">Класс</label>
                <input type="text" class="form-control" id="regClass" placeholder="Например: 5Б">
                <label class="form-label">Ваш родитель (email)</label>
                <input type="email" class="form-control" id="regParentEmail" placeholder="email родителя">
            </div>
            <div class="error-message" id="errorMessage"></div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Зарегистрироваться</button>
        </form>

        <div class="link-text">Уже есть аккаунт? <a onclick="goToLogin()">Войти</a></div>
    </div>

    <script>
        const schoolsByCity = {
            "Москва": ["Школа №123", "Гимназия №1543", "Лицей №1535", "Школа №57"],
            "Санкт-Петербург": ["Школа №239", "Гимназия №56", "Лицей №30", "Школа №1"],
            "Новосибирск": ["Гимназия №1", "Лицей №130", "Школа №25", "Школа №100"],
            "Екатеринбург": ["Гимназия №9", "Лицей №110", "Школа №15", "Школа №200"],
            "Казань": ["Гимназия №7", "Лицей №131", "Школа №25", "Школа №80"],
            "Нижний Новгород": ["Гимназия №1", "Лицей №38", "Школа №10", "Школа №50"],
            "Челябинск": ["Гимназия №1", "Лицей №31", "Школа №12", "Школа №90"],
            "Самара": ["Гимназия №1", "Лицей №5", "Школа №10", "Школа №45"],
            "Омск": ["Гимназия №1", "Лицей №25", "Школа №15", "Школа №60"],
            "Ростов-на-Дону": ["Гимназия №1", "Лицей №11", "Школа №5", "Школа №78"],
            "Сургут": ["Гимназия «Салахов»", "Школа №1", "Школа №10"]
        };

        let currentRole = 'parent';

        function selectRole(role) {
            currentRole = role;
            document.getElementById('roleParent').classList.remove('active');
            document.getElementById('roleChild').classList.remove('active');
            if (role === 'parent') {
                document.getElementById('roleParent').classList.add('active');
                docume
nt.getElementById('childExtraFields').style.display = 'none';
            } else {
                document.getElementById('roleChild').classList.add('active');
                document.getElementById('childExtraFields').style.display = 'block';
            }
        }

        function updateSchools() {
            const city = document.getElementById('regCity').value;
            const schoolSelect = document.getElementById('regSchool');
            schoolSelect.innerHTML = '';
            if (!city || !schoolsByCity[city]) {
                schoolSelect.innerHTML = '<option value="" disabled selected>Сначала выберите город</option>';
                schoolSelect.disabled = true;
                return;
            }
            schoolSelect.disabled = false;
            let placeholder = document.createElement('option');
            placeholder.value = "";
            placeholder.disabled = true;
            placeholder.selected = true;
            placeholder.text = "Выберите школу";
            schoolSelect.appendChild(placeholder);
            schoolsByCity[city].forEach(school => {
                let option = document.createElement('option');
                option.value = school;
                option.text = school;
                schoolSelect.appendChild(option);
            });
        }

        function togglePassword() {
            let p = document.getElementById('regPassword');
            let e = document.getElementById('eyeToggle');
            if (p.type === 'password') { p.type = 'text'; e.textContent = '🙈 '; }
            else { p.type = 'password'; e.textContent = '👁'; }
        }

        function handleRegister(event) {
            event.preventDefault();
            let name = document.getElementById('regName').value.trim();
            let city = document.getElementById('regCity').value;
            let school = document.getElementById('regSchool').value;
            let email = document.getElementById('regEmail').value.trim();
            let password = document.getElementById('regPassword').value.trim();

            if (!city) { showError("Выберите город"); return; }
            if (!school) { showError("Выберите школу"); return; }
            let emailPattern = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i;
            if (!emailPattern.test(email)) { showError("Введите корректный email"); return; }
            if (password.length < 5) { showError("Пароль минимум 5 символов"); return; }

            let users = JSON.parse(sessionStorage.getItem('registeredUsers')) || [];
            if (users.some(u => u.email === email)) { showError("Пользователь уже зарегистрирован"); return; }

            let newUser = { name, city, school, email, password, role: currentRole };
            if (currentRole === 'child') {
                newUser.class = document.getElementById('regClass').value.trim();
                newUser.parentEmail = document.getElementById('regParentEmail').value.trim();
            }
            users.push(newUser);
            sessionStorage.setItem('registeredUsers', JSON.stringify(users));

            alert('✅  Регистрация успешна!\nГород: ' + city + '\nШкола: ' + school + '\nТеперь войдите с вашей почтой: ' + email);
            window.location.href = 'login.html';
        }

        function goToLogin() { window.location.href = 'login.html'; }

        function showError(message) {
            let el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
